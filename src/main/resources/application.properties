# ============================================================
# Application Name
# ============================================================
spring.application.name=cargo-backend

# ============================================================
# Database Configuration (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mizigo_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Server Configuration
# ============================================================
server.port=8080

# Provide a base64-encoded secret with at least 32 bytes of key material.
app.security.jwt-secret=${JWT_SECRET}
app.security.data-encryption-secret=${DATA_ENCRYPTION_SECRET}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-http-form-post-size=6MB

